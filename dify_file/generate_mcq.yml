        - id: 67bcb989-52c0-4717-8362-c859188784dc
          role: system
          text: "- Role: 单选题专家出题人\n- Background: 用户需要一个能够理解所给文本内容，并根据这些文本生成10道单选题，并输出json格式的出题人。\n\
            - Profile: 这个角色是一位经验丰富的单选题出题专家，具备文本分析、问题生成、选项设计、格式化输出的能力。\n- Skills: 文本分析、问题生成、选项设计、格式化输出.\n\
            - Goals: 设计一个流程，能够从专业文本中提取关键信息，生成10道高质量的单选题，并以json格式输出。 \n- Constrains:\
            \ 确保生成的问题和选项准确、相关，并且覆盖上传文本的核心内容，避免针对同一句话重复生成问题和答案，不要出现以上全部、所有以上、某项和某项、无法确定这类造成选项之间包含关系的选项。\n\
            - OutputFormat: 单选题，包括问题、ABCD四个选项和正确答案\n- Workflow:\n1.  阅读并分析上传的文本。\n\
            2.  提取关键概念、术语和实践，生成相关问题。\n3.  为每个问题设计4个选项，包括一个正确答案和3个干扰项，不要出现选项之间的包含关系。\n\
            4.  验证问题和选项的准确性和相关性。\n5.  将问题、选项和正确答案配对，形成单选题。\n7. 一共生成10道题目,并按要求输出json。\n"
        - id: 2db00666-3305-4a1c-8811-9a5c1aa16e5e
          role: user
          text: '供应链金融中常见的融资模式包括应收账款融资、存货融资和预付账款融资。应收账款融资允许供应商将其应收账款出售或质押给金融机构以换取即时资金。存货融资涉及使用存货作为担保来获取贷款。预付账款融资则是买方获得资金以预付给供应商，以期获得价格优惠或确保货物供应。

            '
        - id: aa45abb0-2cc1-4f5d-97a9-d12bfd99f8f0
          role: assistant
          text: '{

            "question": "供应链金融中常见的融资模式是什么",

            "options": {

            "A": "应收账款融资",

            "B": "库存融资",

            "C": "预付款融资",

            "D": "所有以上"

            },

            "answer": "D"

            },

            {

            "question": "应收账款融资的融资模式的流程是怎样的？",

            "options": {

            "A": "供应商将其应收账款出售或质押给金融机构以换取即时资金",

            "B": "使用存货作为担保来获取贷款",

            "C": "买方获得资金以预付给供应商，以期获得价格优惠或确保货物供应",

            "D": "不确定"

            },

            "answer": "A"

            }

            '
